[project]
name = "noviz_ai"
authors = [
    { name = "Zeetech Soft Solution", email = "tajdink@gmail.com"}
]
description = "Open-source Frappe/ERPNext integration plugin for Noviz AI. The plugin acts as a lightweight client that connects ERPNext to the Noviz Relay API, with AI processing, orchestration, and business logic handled by the Noviz AI platform."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe is installed and managed by bench — see
    # [tool.bench.frappe-dependencies] below for the real, functional
    # version declaration Frappe Cloud actually reads.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]

# Real Frappe Cloud requirement (docs.frappe.io/cloud/benches/custom-app) —
# declares which Frappe versions this app supports. v15 and v16 are
# confirmed via a real bench get-app + bench install-app test (2026-08-21,
# Frappe 15.118.0 and 16.29.0/16.30.0). v13/v14 are included in the range
# below but have NOT been tested against — widened on explicit request
# before verification, same real risk class as the structural bugs found
# and fixed testing v15/v16 today.
[tool.bench.frappe-dependencies]
frappe = ">=13.0.0,<17.0.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
